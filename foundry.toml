[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
fuzz = { runs = 10 }  # fork fuzz tests take ~70s each — 10 runs ≈ 12 min
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# Optimizer settings to reduce contract size
optimizer = true
# 200 runs optimizes for runtime gas (every deposit/withdraw/rebalance is cheaper for users).
# via-IR keeps the size cost small: deployed vaults are ~22.8KB, still ~1.7KB under the
# 24,576-byte EIP-170 limit. The immutable core means no code is added post-deploy, so the
# reduced headroom (vs 1 run) is acceptable. Drop back toward 1 only if a future vault overflows.
optimizer_runs = 200

# Via IR for better optimization (reduces contract size significantly)
via_ir = true

# EVM version - cancun required for Curve Tricrypto pools
evm_version = "cancun"

[profile.ci]
fuzz = { runs = 5 }
invariant = { runs = 5 }

[profile.coverage]
via_ir = false
optimizer = false

[profile.h4]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
test = "test/h4verify"

[profile.verify]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
test = "test/verify"

[profile.h2]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
test = "test/h2verify"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
